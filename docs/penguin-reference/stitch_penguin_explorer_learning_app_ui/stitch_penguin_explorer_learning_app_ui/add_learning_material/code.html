<script>
  (function initCardSelection() {
    const cards = document.querySelectorAll('.upload-option');
    if (!cards.length) return;

    // Set first card selected by default for clear immediate visual feedback
    selectCard(cards[0]);

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        selectCard(card);
      });
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectCard(card);
        }
      });
    });

    function selectCard(selected) {
      cards.forEach((c) => {
        const checkIcon = c.querySelector('.radio-indicator span');
        const indicator = c.querySelector('.radio-indicator');
        if (c === selected) {
          c.classList.add('bg-surface-container-lowest', 'shadow-[0_12px_28px_-4px_rgba(107,255,143,0.35)]');
          c.style.transform = 'scale(1.02)';
          if (indicator) {
            indicator.classList.remove('bg-surface-container-low');
            indicator.classList.add('bg-secondary', 'text-on-secondary');
          }
          if (checkIcon) {
            checkIcon.classList.remove('opacity-0', 'text-secondary');
            checkIcon.classList.add('opacity-100', 'text-on-secondary');
          }
        } else {
          c.classList.remove('shadow-[0_12px_28px_-4px_rgba(107,255,143,0.35)]');
          c.style.transform = 'scale(1)';
          if (indicator) {
            indicator.classList.add('bg-surface-container-low');
            indicator.classList.remove('bg-secondary', 'text-on-secondary');
          }
          if (checkIcon) {
            checkIcon.classList.add('opacity-0');
            checkIcon.classList.remove('opacity-100', 'text-on-secondary');
          }
        }
      });
    }

    const actionBtn = document.getElementById('hero-submit-btn');
    if (actionBtn) {
      actionBtn.addEventListener('click', () => {
        actionBtn.classList.add('scale-90');
        setTimeout(() => {
          actionBtn.classList.remove('scale-90');
        }, 150);
      });
    }
  })();
