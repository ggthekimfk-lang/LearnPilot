"space-lg": "1.5rem" }, fontFamily: { "visual-heading": ["Plus Jakarta Sans"], "visual-dense": ["Plus Jakarta Sans"], "visual-subheading": ["Plus Jakarta Sans"], "visual-hero": ["Plus Jakarta Sans"], "visual-display": ["Plus Jakarta Sans"], "visual-hero-mobile": ["Plus Jakarta Sans"], "visual-lead": ["Plus Jakarta Sans"], "visual-micro": ["Plus Jakarta Sans"], "visual-standard": ["Plus Jakarta Sans"] }, fontSize: { "visual-heading": ["24px", { "lineHeight": "24px", "fontWeight": "600" }], "visual-dense": ["12px", { "lineHeight": "12px", "fontWeight": "400" }], "visual-subheading": ["20px", { "lineHeight": "20px", "fontWeight": "500" }], "visual-hero": ["48px", { "lineHeight": "48px", "fontWeight": "700" }], "visual-display": ["32px", { "lineHeight": "32px", "fontWeight": "600" }], "visual-hero-mobile": ["36px", { "lineHeight": "36px", "fontWeight": "700" }], "visual-lead": ["16px", { "lineHeight": "16px", "fontWeight": "500" }], "visual-micro": ["10px", { "lineHeight": "10px", "fontWeight": "400" }], "visual-standard": ["14px", { "lineHeight": "14px", "fontWeight": "400" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#f9f9f9;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col w-full bg-surface px-margin-mobile"><div class="flex flex-col w-full relative select-none overflow-hidden pb-margin">
<div class="relative w-full rounded-xl overflow-hidden shadow-2xl flex flex-col justify-between min-h-[640px] aspect-[9/16]">
<img alt="" class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtMPZMgUcODciMskoqBUCW7vp_U9QwzDCZvRGWgMVhKNxBzyr4HlgGFhSXxBrkr9ZC7y7e7rPdrolLAfXBalk4IFg4ts589-Z3uJlvOGesWGUAawkXgqVwSvLS76TDVYw25T7nu4xIpkHV4OZ6f4vBRrFf5j6fT7ztxprUMQoUP7Tv8NPfpRJjinU7y5W6LT1pu3jk4IH6cgSB4z-wm5TA-uhzFml-5HJ8xev3NgvTOaJGwR_jr6nE"/>
<div class="absolute inset-0 bg-gradient-to-b from-primary-fixed/20 via-transparent to-surface-container-lowest/80 pointer-events-none"></div>
<header class="relative z-10 w-full pt-space-md px-margin-mobile flex items-center justify-between">
<div class="flex items-center gap-space-xs bg-surface-container-lowest/80 backdrop-blur-md px-space-sm py-2 rounded-full shadow-sm">
<span class="w-2.5 h-2.5 rounded-full bg-secondary shadow-sm animate-pulse"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant/60"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant/40"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant/30"></span>
</div>
<div class="flex items-center gap-space-xs">
<button aria-label="audio" class="w-10 h-10 rounded-full bg-surface-container-lowest/85 backdrop-blur-md flex items-center justify-center text-primary shadow-sm active:scale-90 transition-transform duration-200" id="sound-toggle-btn" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<button aria-label="sparkles" class="w-10 h-10 rounded-full bg-surface-container-lowest/85 backdrop-blur-md flex items-center justify-center text-secondary shadow-sm active:scale-90 transition-transform duration-200" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</button>
</div>
</header>
<div class="flex-1"></div>
<div class="relative z-10 w-full px-margin-mobile pb-space-lg flex flex-col items-center">
<div class="w-full bg-surface-container-lowest/90 backdrop-blur-xl rounded-xl p-space-lg shadow-xl flex flex-col items-center gap-space-md">
<div class="flex items-center justify-center gap-space-xs mb-space-xs">
<span class="w-8 h-1.5 rounded-full bg-secondary"></span>
<span class="w-2 h-1.5 rounded-full bg-surface-variant"></span>
<span class="w-2 h-1.5 rounded-full bg-surface-variant"></span>
</div>
<button aria-label="start" class="w-full h-14 bg-secondary text-on-secondary rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-all duration-300 relative overflow-hidden group" id="main-action-btn" type="button">
<div class="absolute inset-0 bg-secondary-container/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-[32px] tracking-widest drop-shadow-sm group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<button aria-label="explore" class="w-full h-12 bg-primary-container/30 text-on-primary-container rounded-full flex items-center justify-center active:scale-95 transition-all duration-200 shadow-sm" type="button">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">explore</span>
</button>
</div>
</div>
</div>
<div class="absolute inset-0 pointer-events-none z-20 overflow-hidden" id="particle-canvas-container"></div>
<script>
    (function () {
      const startBtn = document.getElementById('main-action-btn');
      const soundBtn = document.getElementById('sound-toggle-btn');
      const particleContainer = document.getElementById('particle-canvas-container');

      if (startBtn && particleContainer) {
        startBtn.addEventListener('click', (e) => {
          const rect = startBtn.getBoundingClientRect();
          const originX = rect.left + rect.width / 2;
          const originY = rect.top + rect.height / 2;

          for (let i = 0; i < 14; i++) {
            const star = document.createElement('div');
            star.className = 'absolute material-symbols-outlined text-secondary select-none text-[20px] transition-all duration-700 ease-out pointer-events-none';
            star.innerText = 'star';
            star.style.fontVariationSettings = "'FILL' 1";
            star.style.left = `${originX}px`;
            star.style.top = `${originY}px`;
            star.style.opacity = '1';
            star.style.transform = 'translate(-50%, -50%) scale(0.6)';

            particleContainer.appendChild(star);

            const angle = Math.random() * Math.PI * 2;
            const distance = 40 + Math.random() * 80;
            const targetX = Math.cos(angle) * distance;
            const targetY = Math.sin(angle) * distance;

            requestAnimationFrame(() => {
              star.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(${1 + Math.random() * 0.5})`;
              star.style.opacity = '0';
            });

            setTimeout(() => {
              if (star.parentNode) {
                star.parentNode.removeChild(star);
              }
            }, 750);
          }
        });
      }

      if (soundBtn) {
        let isMuted = false;
        soundBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          const icon = soundBtn.querySelector('span');
          if (icon) {
            icon.innerText = isMuted ? 'volume_off' : 'volume_up';
          }
        });
      }
    })();
  </script>
</div></main></body></html>
